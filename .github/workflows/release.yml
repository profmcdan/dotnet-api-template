name: release

# Tag a commit `v1.2.3` and this publishes ProfmcdanDotnetApiTemplate.Cli and
# ProfmcdanDotnetApiTemplate.Templates to nuget.org, then opens a GitHub release.
#
# Publishing uses nuget.org Trusted Publishing (OIDC): GitHub mints a short-lived, signed token
# for this workflow, nuget.org validates it against a policy you registered, and hands back an
# API key that lives for one hour. No long-lived key is stored anywhere.
#
# PREREQUISITES
#   1. A Trusted Publishing policy on nuget.org (your username menu -> Trusted Publishing) with:
#        Repository Owner  profmcdan
#        Repository        dotnet-api-template
#        Workflow File     release.yml          <- file name only, no path
#        Environment       (leave empty unless you add one below)
#   2. A repository variable NUGET_USER holding your nuget.org profile name (not your email).
#      Settings -> Secrets and variables -> Actions -> Variables.
#
# Without these the first step fails with a clear message and nothing is published.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Pack and upload artifacts, but do not push to nuget.org'
        required: false
        default: true
        type: boolean

permissions:
  contents: write   # create the GitHub release
  id-token: write   # mint the OIDC token that nuget.org exchanges for a short-lived key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checked first so a misconfiguration costs seconds rather than a full test-pack-smoke
      # cycle. There is no API key to check any more - only who we publish as.
      - name: Check the publisher identity
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not configured, so the OIDC token exchange would fail."
            {
              echo "### Missing NUGET_USER"
              echo ""
              echo "Nothing was published. Trusted Publishing needs to know which nuget.org"
              echo "account to publish as."
              echo ""
              echo "1. Add a repository **variable** named \`NUGET_USER\` set to your nuget.org"
              echo "   profile name — not your email address."
              echo "   (Settings → Secrets and variables → Actions → Variables)"
              echo "2. Confirm the Trusted Publishing policy on nuget.org matches this repository"
              echo "   and names \`release.yml\` as the workflow file."
              echo "3. Re-run this workflow — the tag does not need recreating."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Publishing as nuget.org user '$NUGET_USER'."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Source Link embeds the commit; a shallow clone breaks it.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # A tag that disagrees with the checked-in version means anyone building from source gets
      # a tool that reports a version which was never published. Catch it here rather than after
      # it is on nuget.org forever.
      #
      # The value comes from MSBuild rather than from grepping the XML: MSBuild evaluates the
      # real property through the whole import chain, so it cannot be fooled by a <Version> that
      # happens to appear inside a comment.
      - name: Check the tag matches the checked-in version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DECLARED=$(dotnet msbuild tools/DotnetApiTemplate.Cli/DotnetApiTemplate.Cli.csproj \
                       -getProperty:Version -nologo | tr -d '[:space:]')

          if [ -z "$DECLARED" ]; then
            echo "::error::Could not read the Version property from the project."
            exit 1
          fi

          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag v$VERSION does not match Directory.Packaging.props ($DECLARED)."
            {
              echo "### Version mismatch"
              echo ""
              echo "The tag says \`$VERSION\`; \`Directory.Packaging.props\` says \`$DECLARED\`."
              echo ""
              echo "Fix it with:"
              echo ""
              echo '```bash'
              echo "git tag -d v$VERSION && git push --delete origin v$VERSION"
              echo "./scripts/release.sh $VERSION"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Version $VERSION matches the repository."

      - name: Test
        run: |
          dotnet test CleanArchTemplate.slnx --configuration Release
          dotnet test tools/DotnetApiTemplate.slnx --configuration Release

      - name: Pack
        run: |
          dotnet pack tools/DotnetApiTemplate.slnx \
            --configuration Release \
            --output ./artifacts \
            -p:Version=${{ steps.version.outputs.version }}

          ls -la ./artifacts

      # Install the packed tool and scaffold with it, so a broken package cannot reach nuget.org.
      - name: Smoke test the packed tool
        run: |
          dotnet tool install --global --add-source "$PWD/artifacts" \
            ProfmcdanDotnetApiTemplate.Cli --version ${{ steps.version.outputs.version }}
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet-api-template info
          dotnet-api-template new --project-name Smoke.Test --no-git --allow-grpc
          dotnet build Smoke.Test/Smoke.Test.slnx --configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          retention-days: 30

      # Immediately before the push: the key nuget.org issues is valid for one hour, and the
      # OIDC token behind it can be exchanged exactly once.
      - name: Exchange the OIDC token for a short-lived nuget.org key
        id: nuget-login
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          # Via env rather than inline, so the key never appears in a command line.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # --skip-duplicate makes a re-run after a partial failure safe: versions already on
          # nuget.org are reported and skipped rather than failing the job.
          if ! dotnet nuget push "artifacts/*.nupkg" \
                 --source https://api.nuget.org/v3/index.json \
                 --api-key "$NUGET_API_KEY" \
                 --skip-duplicate; then
            {
              echo "### Push failed"
              echo ""
              echo "The short-lived key was issued, so the Trusted Publishing policy matched."
              echo ""
              echo "- **403** - the policy owner does not own these package ids, or the ids are"
              echo "  already owned by someone else. Package ids are first-come and permanent."
              echo "- **409** - that version already exists. Bump and re-tag."
              echo "- **401** - the key expired. It lasts one hour; if the job was re-run from a"
              echo "  cached state, run it again from the start."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Create the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            dotnet tool install --global ProfmcdanDotnetApiTemplate.Cli --version ${{ steps.version.outputs.version }}
            dotnet-api-template new --project-name Acme.Billing --allow-grpc
            ```

            Prefer no global tool?

            ```bash
            dotnet new install ProfmcdanDotnetApiTemplate.Templates::${{ steps.version.outputs.version }}
            dotnet new cleanapi -n Acme.Billing --allow-grpc
            ```
