syntax = "proto3";

option csharp_namespace = "CleanArchTemplate.Api.Grpc";

// Deliberately NOT the Kafka topic prefix: that is a deployment identity which may legally
// contain hyphens, and a hyphen is not valid in a protobuf package name.
package users.v1;

import "google/protobuf/timestamp.proto";

// Read-only user service for internal service-to-service calls.
// Mutations stay on the REST surface so there is one place where the invite flow lives.
service Users {
  rpc GetUser (GetUserRequest) returns (UserReply);
  rpc ListUsers (ListUsersRequest) returns (ListUsersReply);
}

message GetUserRequest {
  string user_id = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string role = 4;
}

message ListUsersReply {
  repeated UserReply items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_count = 4;
}

message UserReply {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string status = 4;
  repeated string roles = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_login_at = 7;
}
