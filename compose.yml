# Local development stack. Every value comes from .env - copy .env.sample and edit.
#
#   docker compose up -d
#
# Start order is enforced with health checks and `service_completed_successfully`, so the API and
# worker never come up against a database without a schema or a broker without topics.

name: ${COMPOSE_PROJECT_NAME:-cleanarch}

x-dotnet-service: &dotnet-service
  env_file: [.env]
  restart: unless-stopped
  # The images run as UID 64198 and own nothing writable, so the root filesystem can stay read-only.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # -------------------------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Postgres 18 keeps initdb settings here rather than in the data directory root.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Cache and idempotency claims only - AOF keeps them across a restart without needing durability.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redpanda:
    image: redpandadata/redpanda:v25.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners: `redpanda:9092` for containers, `localhost:19092` for tools on the host.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      # Auto topic creation is off by default in Redpanda, which is what we want: the migrator
      # creates every topic explicitly with its intended partitions and retention.
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [backend]

  redpanda-console:
    image: redpandadata/console:v3.3.0
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONFIG_FILEPATH: /tmp/console-config.yaml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/console-config.yaml; /app/console'
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8085}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [backend]

  mailpit:
    # Catches every outbound email locally. Read them at http://localhost:8025 - nothing is
    # actually delivered, which is exactly what you want while testing an invite flow.
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [backend]

  # -------------------------------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------------------------------
  migrator:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/CleanArchTemplate.Migrator/CleanArchTemplate.Migrator.csproj
        ENTRY_DLL: CleanArchTemplate.Migrator.dll
    # A run-to-completion job: applies migrations, seeds Kafka topics, seeds the first admin.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/CleanArchTemplate.Api/CleanArchTemplate.Api.csproj
        ENTRY_DLL: CleanArchTemplate.Api.dll
    ports:
      - "${API_HTTP_PORT:-5080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: src/CleanArchTemplate.Worker/CleanArchTemplate.Worker.csproj
        ENTRY_DLL: CleanArchTemplate.Worker.dll
    ports:
      - "${WORKER_HTTP_PORT:-5081}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  redpanda-data:

networks:
  backend:
    driver: bridge
